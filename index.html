  <style>
    body {
      margin: 0;
      background-color: #000000;
      overflow: hidden;
    }
    #initial-loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background-color: #000000; z-index: 99999;
    }
    .ag-monogram {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -3px;
      fill: transparent;
      stroke: #ffffff;
      stroke-width: 1.5px;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawOutline 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
      fillText 0.5s ease forwards 1.2s;
    }
    .ag-accent {
      stroke: #ea580c;
      animation: drawOutline 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
      fillAccent 0.5s ease forwards 1.2s;
    }
    .ag-progress-container {
      margin-top: 30px;
      width: 180px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .ag-progress-bar {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 30%;
      background: #ea580c;
      animation: scanline 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes drawOutline { to { stroke-dashoffset: 0; } }
    @keyframes fillText { to { fill: #ffffff; stroke: transparent; } }
    @keyframes fillAccent { to { fill: #ea580c; stroke: transparent; } }
    @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
<div id="root">
  <div id="initial-loader">
    <svg width="160" height="90" viewBox="0 0 160 90">
      <text x="50%" y="70%" text-anchor="middle" class="ag-monogram">
        A<tspan class="ag-accent">G</tspan>.
      </text>
    </svg>
    <div class="ag-progress-container">
      <div class="ag-progress-bar"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
